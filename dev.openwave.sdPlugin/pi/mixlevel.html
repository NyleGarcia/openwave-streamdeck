<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenWave — Volume</title>
<!-- Serves Mix Volume, Source Volume and Mix Send: the page renders whatever
     list the plugin sends, and the plugin decides which kind that is. The
     filename is historical -- placed actions store this path in the profile,
     so renaming it would strand keys already on a deck. -->
<link rel="stylesheet" href="_shared.css" />
<script src="_shared.js"></script>
</head>
<body>
  <div id="single">
    <label for="target">Control</label>
    <select id="target"><option value="">Loading…</option></select>
  </div>
  <div id="pair" hidden>
    <label for="pairSource">Source</label>
    <select id="pairSource"></select>
    <label for="pairMix" style="margin-top:12px">In which mix</label>
    <select id="pairMix"></select>
  </div>
  <div id="behaviour" style="margin-top:14px">
    <label for="press">When pressed</label>
    <select id="press">
      <option value="mute">Mute / unmute</option>
      <option value="up">Turn up</option>
      <option value="down">Turn down</option>
    </select>
    <label for="step" style="margin-top:12px">Step size</label>
    <select id="step"></select>
  </div>
  <p class="hint" id="hint">Rotate to adjust, press to mute.</p>
  <div style="margin-top:16px;border-top:1px solid #343a42;padding-top:14px">
    <label for="theme">Colours <span style="font-weight:400;color:#8b929b">
      — applies to every key</span></label>
    <select id="theme"></select>
  </div>
  <p class="warn" id="warn" hidden></p>

<script>
const select = document.getElementById("target");
const warn = document.getElementById("warn");
const pressSelect = document.getElementById("press");
const stepSelect = document.getElementById("step");
const sourceSelect = document.getElementById("pairSource");
const mixSelect = document.getElementById("pairMix");
let targets = [];

OpenWave.onPayload((payload) => {
  if (!payload) return;
  if (payload.hint) {
    document.getElementById("hint").textContent =
      "Rotate to adjust, press to mute. " + payload.hint;
  }
  renderBehaviour(payload);
  renderTheme(payload);
  // Two dropdowns when the thing being chosen is genuinely two choices: a
  // source and the mix it sits in. One combined list is every pairing, which
  // grows as sources x mixes and is long before it is useful.
  if (payload.pair) {
    document.getElementById("single").hidden = true;
    document.getElementById("pair").hidden = false;
    renderPair(payload);
    return;
  }
  targets = payload.targets || [];
  render(payload);
});

function renderTheme(payload) {
  const node = document.getElementById("theme");
  if (!payload.themes) return;
  if (!node.options.length) {
    for (const theme of payload.themes) {
      node.appendChild(new Option(theme.label, theme.id));
    }
  }
  node.value = payload.theme || "default";
  node.onchange = () => OpenWave.saveGlobal({ theme: node.value });
}

function renderBehaviour(payload) {
  // A dial rotates and presses; a key only presses, so on a key the press is
  // the entire control and being able to make it a step is the difference
  // between three keys and one.
  pressSelect.value = payload.press || "mute";
  if (!stepSelect.options.length) {
    for (const value of [1, 2, 3, 5, 10, 15, 20, 25]) {
      stepSelect.appendChild(new Option(value + "%", String(value)));
    }
  }
  stepSelect.value = String(payload.step || 2);
  const save = () => OpenWave.save({
    press: pressSelect.value, step: Number(stepSelect.value),
  });
  pressSelect.onchange = save;
  stepSelect.onchange = save;
  updateStepVisibility();
  pressSelect.addEventListener("change", updateStepVisibility);
}

function updateStepVisibility() {
  // A step means nothing to a key that mutes -- but a dial still rotates by
  // it, so it is only hidden when neither use applies.
  const stepping = pressSelect.value !== "mute";
  const dial = (OpenWave.controller() === "Encoder");
  stepSelect.parentElement.querySelector('label[for="step"]').hidden =
    !stepping && !dial;
  stepSelect.hidden = !stepping && !dial;
}

function fill(node, items, selected) {
  node.innerHTML = "";
  node.appendChild(new Option("Choose…", ""));
  let group = null;
  let parent = node;
  for (const item of items) {
    if (item.group && item.group !== group) {
      group = item.group;
      parent = document.createElement("optgroup");
      parent.label = group;
      node.appendChild(parent);
    } else if (!item.group) {
      parent = node;
    }
    const option = new Option(item.label, item.id);
    if (item.id === selected) option.selected = true;
    parent.appendChild(option);
  }
}

function renderPair(payload) {
  const pair = payload.pair;
  warn.hidden = true;
  if (!payload.openwave) {
    warn.textContent = "OpenWave is not running, and this action needs it: "
      + "a source's level inside one mix is OpenWave's own state.";
    warn.hidden = false;
  }
  // "cell:<source>:<mix>"
  const parts = (pair.chosen || "").split(":");
  fill(sourceSelect, pair.sources, parts[1] || "");
  fill(mixSelect, pair.mixes, parts[2] || "");

  const save = () => {
    const source = sourceSelect.value;
    const mix = mixSelect.value;
    // Saved only once both halves are chosen; half a target names nothing,
    // and writing one would blank a key that already had a working pair.
    if (!source || !mix) {
      warn.textContent = "Choose a source and a mix.";
      warn.hidden = false;
      return;
    }
    warn.hidden = !!payload.openwave ? true : warn.hidden;
    OpenWave.save({ target: `cell:${source}:${mix}`, mix: "" });
  };
  sourceSelect.onchange = save;
  mixSelect.onchange = save;
  OpenWave.report(`pair: ${pair.sources.length} sources x `
    + `${pair.mixes.length} mixes, chosen=${pair.chosen || "none"}`);
}

function render(payload) {
  const chosen = payload.chosen || OpenWave.settings().target
    || (OpenWave.settings().mix ? "mix:" + OpenWave.settings().mix : "");
  select.innerHTML = "";
  warn.hidden = true;

  if (targets.length === 0) {
    select.innerHTML = '<option value="">Nothing to control</option>';
    warn.textContent = payload.openwave
      ? "OpenWave has nothing of this kind configured yet."
      : "OpenWave is not running, and this action needs it.";
    warn.hidden = false;
    return;
  }

  const placeholder = new Option("Choose what to control…", "");
  select.appendChild(placeholder);

  // Grouped so the three kinds are told apart at a glance: a mix and a
  // microphone can easily share a name, and they behave very differently.
  const groups = new Map();
  for (const target of targets) {
    if (!groups.has(target.group)) groups.set(target.group, []);
    groups.get(target.group).push(target);
  }
  for (const [name, members] of groups) {
    const optgroup = document.createElement("optgroup");
    optgroup.label = name;
    for (const target of members) {
      const option = new Option(
        target.label + (target.isDefault ? "  (system output)" : ""),
        target.value,
      );
      if (target.value === chosen) option.selected = true;
      optgroup.appendChild(option);
    }
    select.appendChild(optgroup);
  }
  OpenWave.report(`rendered ${select.options.length} options, `
    + `${groups.size} groups, chosen=${chosen || "none"}, `
    + `visible=${!!select.offsetParent}`);

  if (!payload.openwave) {
    warn.textContent = "OpenWave is not running, so only mixes can be "
      + "listed. Start it to choose a source or a send.";
    warn.hidden = false;
  } else {
    showDefaultWarning(chosen);
  }
}

function showDefaultWarning(chosen) {
  // The monitoring mix is normally the system default sink, so its master is
  // effectively the machine's volume. Worth saying plainly rather than
  // letting someone discover it by muting everything.
  const target = targets.find((t) => t.value === chosen);
  if (target && target.isDefault) {
    warn.textContent = "This mix is the system output. Muting it silences "
      + "everything, not just OpenWave.";
    warn.hidden = false;
  } else {
    warn.hidden = true;
  }
}

select.onchange = () => {
  // The legacy key is cleared, not left behind: with both set, a settings
  // blob read by an older build would disagree with this one.
  OpenWave.save({ target: select.value, mix: "" });
  showDefaultWarning(select.value);
};
</script>
</body>
</html>
