<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenWave — Volume</title>
<!-- Serves Mix Volume, Source Volume and Mix Send: the page renders whatever
     list the plugin sends, and the plugin decides which kind that is. The
     filename is historical -- placed actions store this path in the profile,
     so renaming it would strand keys already on a deck. -->
<link rel="stylesheet" href="_shared.css" />
<script src="_shared.js"></script>
</head>
<body>
  <label for="target">Control</label>
  <select id="target"><option value="">Loading…</option></select>
  <p class="hint" id="hint">Rotate to adjust, press to mute.</p>
  <p class="warn" id="warn" hidden></p>

<script>
const select = document.getElementById("target");
const warn = document.getElementById("warn");
let targets = [];

OpenWave.onPayload((payload) => {
  if (!payload) return;
  targets = payload.targets || [];
  if (payload.hint) {
    document.getElementById("hint").textContent =
      "Rotate to adjust, press to mute. " + payload.hint;
  }
  render(payload);
});

function render(payload) {
  const chosen = OpenWave.settings().target
    || (OpenWave.settings().mix ? "mix:" + OpenWave.settings().mix : "");
  select.innerHTML = "";
  warn.hidden = true;

  if (targets.length === 0) {
    select.innerHTML = '<option value="">Nothing to control</option>';
    warn.textContent = payload.openwave
      ? "OpenWave has nothing of this kind configured yet."
      : "OpenWave is not running, and this action needs it.";
    warn.hidden = false;
    return;
  }

  const placeholder = new Option("Choose what to control…", "");
  select.appendChild(placeholder);

  // Grouped so the three kinds are told apart at a glance: a mix and a
  // microphone can easily share a name, and they behave very differently.
  const groups = new Map();
  for (const target of targets) {
    if (!groups.has(target.group)) groups.set(target.group, []);
    groups.get(target.group).push(target);
  }
  for (const [name, members] of groups) {
    const optgroup = document.createElement("optgroup");
    optgroup.label = name;
    for (const target of members) {
      const option = new Option(
        target.label + (target.isDefault ? "  (system output)" : ""),
        target.value,
      );
      if (target.value === chosen) option.selected = true;
      optgroup.appendChild(option);
    }
    select.appendChild(optgroup);
  }
  OpenWave.report(`rendered ${select.options.length} options, `
    + `${groups.size} groups, chosen=${chosen || "none"}, `
    + `visible=${!!select.offsetParent}`);

  if (!payload.openwave) {
    warn.textContent = "OpenWave is not running, so only mixes can be "
      + "listed. Start it to choose a source or a send.";
    warn.hidden = false;
  } else {
    showDefaultWarning(chosen);
  }
}

function showDefaultWarning(chosen) {
  // The monitoring mix is normally the system default sink, so its master is
  // effectively the machine's volume. Worth saying plainly rather than
  // letting someone discover it by muting everything.
  const target = targets.find((t) => t.value === chosen);
  if (target && target.isDefault) {
    warn.textContent = "This mix is the system output. Muting it silences "
      + "everything, not just OpenWave.";
    warn.hidden = false;
  } else {
    warn.hidden = true;
  }
}

select.onchange = () => {
  // The legacy key is cleared, not left behind: with both set, a settings
  // blob read by an older build would disagree with this one.
  OpenWave.save({ target: select.value, mix: "" });
  showDefaultWarning(select.value);
};
</script>
</body>
</html>
